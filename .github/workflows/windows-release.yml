name: Release successful Windows build

on:
  workflow_run:
    workflows:
      - Windows build and security tests
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: dowe-pinless-release-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and release verified Windows artifact
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: windows-latest
    steps:
      - name: Download artifact from completed build
        uses: actions/download-artifact@v4
        with:
          name: dowe-pinless-release-x64
          path: release-input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Package Release x64 artifact
        shell: pwsh
        run: |
          $required = @('DowePinlessService.exe', 'DowePinlessEnroll.exe', 'DowePinlessCredentialProvider.dll')
          foreach ($name in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path '.\release-input' $name))) {
              throw "Release artifact is missing required file: $name"
            }
          }
          $forbidden = Get-ChildItem -LiteralPath '.\release-input' -Recurse -File |
            Where-Object { $_.Name -match '(?i)(secret|seed|recovery|token|password|pin|\.dpapi$)' }
          if ($forbidden) {
            throw 'Release artifact contains a forbidden secret-like filename'
          }
          Compress-Archive -Path .\release-input\* -DestinationPath .\DowePinless-Release-x64.zip
          $hash = (Get-FileHash '.\DowePinless-Release-x64.zip' -Algorithm SHA256).Hash
          @(
            "$hash  DowePinless-Release-x64.zip"
            "build-run: ${{ github.event.workflow_run.run_number }}"
            "commit: ${{ github.event.workflow_run.head_sha }}"
          ) | Set-Content -LiteralPath '.\SHA256SUMS.txt' -Encoding ascii

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.event.workflow_run.run_number }}
          name: Dowe Pinless build ${{ github.event.workflow_run.run_number }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          generate_release_notes: true
          files: |
            DowePinless-Release-x64.zip
            SHA256SUMS.txt
